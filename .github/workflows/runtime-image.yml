name: Hermes Runtime Image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "docker/Dockerfile.runtime-python-node"
      - ".github/workflows/runtime-image.yml"
      - "scripts/check_container_image_policy.py"
  pull_request:
    branches: [main]
    paths:
      - "docker/Dockerfile.runtime-python-node"
      - ".github/workflows/runtime-image.yml"
      - "scripts/check_container_image_policy.py"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the runtime image to GHCR"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      runtime_tag:
        description: "Runtime semantic tag to publish"
        required: true
        default: "python3.11-node20"

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: autoarq-paulo/hermes-agent-runtime
  DEFAULT_RUNTIME_TAG: python3.11-node20

jobs:
  build:
    name: Build and optionally publish runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          runtime_tag="${{ github.event.inputs.runtime_tag || env.DEFAULT_RUNTIME_TAG }}"
          short_sha="${GITHUB_SHA::12}"

          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${runtime_tag}"
            echo "${image}:stable"
            echo "${image}:sha-${short_sha}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${image}:${GITHUB_REF_NAME}-runtime"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: docker/Dockerfile.runtime-python-node
          load: true
          platforms: linux/amd64
          tags: hermes-agent-runtime:ci-smoke
          cache-from: type=gha,scope=hermes-runtime
          cache-to: type=gha,mode=max,scope=hermes-runtime

      - name: Smoke test runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm hermes-agent-runtime:ci-smoke python --version
          docker run --rm hermes-agent-runtime:ci-smoke node --version
          docker run --rm hermes-agent-runtime:ci-smoke npm --version

      - name: Log in to GHCR
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch image
        id: push
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: docker/Dockerfile.runtime-python-node
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=hermes-runtime
          cache-to: type=gha,mode=max,scope=hermes-runtime

      - name: Write publication summary
        shell: bash
        run: |
          {
            echo "## Hermes runtime image"
            echo
            echo "Image: \`${{ steps.meta.outputs.image }}\`"
            echo
            echo "Tags:"
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            if [[ -n "${{ steps.push.outputs.digest }}" ]]; then
              echo "Digest: \`${{ steps.push.outputs.digest }}\`"
              echo
              echo "Pinned reference:"
              echo '```text'
              echo "${{ steps.meta.outputs.image }}:${{ github.event.inputs.runtime_tag || env.DEFAULT_RUNTIME_TAG }}@${{ steps.push.outputs.digest }}"
              echo '```'
            else
              echo "Digest: not published in this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
